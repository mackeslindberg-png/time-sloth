<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>time/sloth live status</title>
  <style>
    :root{
      --bg:#121212; --fg:#fff; --muted:rgba(255,255,255,.65);
      --card:rgba(255,255,255,.08); --outline:rgba(255,255,255,.12);
    }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--fg); }
    .wrap{ max-width:720px; margin:0 auto; padding:18px; }
    .card{ background:var(--card); border:1px solid var(--outline); border-radius:16px; padding:16px; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:baseline; }
    .title{ font-size:20px; font-weight:700; }
    .muted{ color:var(--muted); }
    .big{ font-size:56px; font-weight:800; letter-spacing:1px; margin:10px 0 4px; }
    .mode{ font-size:22px; font-weight:700; }
    .pill{ display:inline-block; padding:6px 10px; border-radius:999px; border:1px solid var(--outline); color:var(--muted); }
    .err{ color:#ffb4b4; }
    a{ color:inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="title">time/sloth status</div>
        <div id="session" class="pill"></div>
      </div>

      <div style="height:10px"></div>

      <div class="row">
        <div class="mode" id="modeName">–</div>
        <div class="pill" id="phase">–</div>
      </div>

      <div class="big" id="countdown">--:--</div>

      <div class="muted" id="meta">Väntar på data…</div>
      <div class="muted err" id="error" style="margin-top:8px;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcCRjtWpBEptwnlouaA4khMFHcDm7BjrE",
      authDomain: "time-sloth-live.firebaseapp.com",
      databaseURL: "https://time-sloth-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "time-sloth-live",
      storageBucket: "time-sloth-live.firebasestorage.app",
      messagingSenderId: "1011472987100",
      appId: "1:1011472987100:web:483c2dac92f8158df59519"
    };

    const $ = (id)=>document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("s") || params.get("session") || "";

    $("session").textContent = sessionId ? `session: ${sessionId}` : "saknar ?s=...";

    if (!sessionId) {
      $("error").textContent = "Ingen session angiven. Öppna länken med ?s=<sessionId> (från QR-koden).";
      throw new Error("Missing sessionId");
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Valfritt: anonym login även på status-sidan (inte nödvändigt för read, men skadar inte).
    // Om du vill vara superstrikt och ha .read kräva auth, då behövs detta.
    try {
      await signInAnonymously(getAuth(app));
    } catch {}

    const statusRef = ref(db, `sessions/${sessionId}/status`);

    let lastStatus = null;
    let tickTimer = null;

    function fmt(ms){
      ms = Math.max(0, ms|0);
      const total = Math.ceil(ms/1000);
      const m = Math.floor(total/60);
      const s = total % 60;
      return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    }

    function startTick(){
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(()=>{
        if (!lastStatus) return;
        const endsAt = Number(lastStatus.endsAt || 0);
        if (!endsAt) { $("countdown").textContent = "--:--"; return; }
        const left = endsAt - Date.now();
        $("countdown").textContent = fmt(left);
      }, 200);
    }

    onValue(statusRef, (snap)=>{
      const v = snap.val();
      lastStatus = v;

      if (!v) {
        $("modeName").textContent = "–";
        $("phase").textContent = "–";
        $("countdown").textContent = "--:--";
        $("meta").textContent = "Ingen status ännu.";
        return;
      }

      $("modeName").textContent = v.modeName || "–";
      $("phase").textContent = v.phase || "–";

      const upd = v.updatedAt ? new Date(Number(v.updatedAt)).toLocaleTimeString("sv-SE") : "–";
      $("meta").textContent = `Uppdaterad: ${upd}`;

      startTick();
    }, (err)=>{
      $("error").textContent = String(err?.message || err);
    });
  </script>
</body>
</html>
