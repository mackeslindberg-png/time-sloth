<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>time/sloth LIVE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#111;
  color:#fff;
  font-family:system-ui;
}

.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:20px;
}

.mode{
  font-size:48px;
  font-weight:900;
}

.time{
  font-size:64px;
  font-weight:900;
}

.small{
  opacity:.7;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="mode" id="mode">Waiting…</div>
  <div class="time" id="time">--:--</div>
  <div class="small" id="next">NEXT UP: --</div>
  <div class="small" id="phase">time/sloth LIVE</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcCRjtWpBEptwnlouaA4khMFHcDm7BjrE",
  authDomain: "time-sloth-live.firebaseapp.com",
  databaseURL: "https://time-sloth-live-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "time-sloth-live",
  storageBucket: "time-sloth-live.firebasestorage.app",
  messagingSenderId: "1011472987100",
  appId: "1:1011472987100:web:483c2dac92f8158df59519"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let wakeLockSentinel = null;

async function requestWakeLock() {
  try {
    if (!("wakeLock" in navigator)) return;
    wakeLockSentinel = await navigator.wakeLock.request("screen");

    wakeLockSentinel.addEventListener("release", () => {
      console.log("Wake lock released");
    });
  } catch (err) {
    console.log("Wake lock failed:", err?.message || err);
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    await requestWakeLock();
  }
});
function fmt(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

const modeEl = document.getElementById("mode");
const timeEl = document.getElementById("time");
const nextEl = document.getElementById("next");
const phaseEl = document.getElementById("phase");

const params = new URLSearchParams(location.search);
const sessionId = params.get("s");

if (!sessionId) {
  modeEl.textContent = "No session";
  timeEl.textContent = "--:--";
  throw new Error("Missing session id");
}

requestWakeLock();

let currentEndsAt = 0;

function renderTime() {
  if (!currentEndsAt || currentEndsAt <= 0) {
    timeEl.textContent = "--:--";
    return;
  }
  const left = currentEndsAt - Date.now();
  timeEl.textContent = fmt(left);
}

setInterval(renderTime, 200);

const statusRef = ref(db, `sessions/${sessionId}/status`);

onValue(statusRef, (snap) => {
  const data = snap.val();
  if (!data) {
    modeEl.textContent = "Waiting…";
    timeEl.textContent = "--:--";
    if (nextEl) nextEl.textContent = "NEXT UP: --";
    if (phaseEl) phaseEl.textContent = "time/sloth LIVE";
    currentEndsAt = 0;
    return;
  }

  modeEl.textContent = data.modeName || "LIVE";

  if (nextEl) {
    nextEl.textContent = data.nextName || "NEXT UP: --";
  }

  if (phaseEl) {
    phaseEl.textContent = data.phase || "time/sloth LIVE";
  }

  currentEndsAt = Number(data.endsAt || 0);
  renderTime();
});
</script>

</body>
</html>
