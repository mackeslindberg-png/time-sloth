<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>time/sloth LIVE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#111;
  color:#fff;
  font-family:system-ui;
}

.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:20px;
}

.mode{
  font-size:48px;
  font-weight:900;
}

.time{
  font-size:64px;
  font-weight:900;
}

.small{
  opacity:.7;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="mode" id="mode">Waiting…</div>
  <div class="time" id="time">--:--</div>
  <div class="small">time/sloth LIVE</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcCRjtWpBEptwnlouaA4khMFHcDm7BjrE",
  authDomain: "time-sloth-live.firebaseapp.com",
  databaseURL: "https://time-sloth-live-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "time-sloth-live",
  storageBucket: "time-sloth-live.firebasestorage.app",
  messagingSenderId: "1011472987100",
  appId: "1:1011472987100:web:483c2dac92f8158df59519"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function fmt(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}

const params = new URLSearchParams(location.search);
const sessionId = params.get("s");

if(!sessionId){
  document.getElementById("mode").textContent="No session";
  throw new Error("missing session");
}

const statusRef = ref(db,"sessions/"+sessionId+"/status");

onValue(statusRef,(snap)=>{

  const data = snap.val();
  if(!data) return;

  document.getElementById("mode").textContent = data.modeName || "LIVE";

  const ends = data.endsAt || 0;

  function update(){
    const left = ends - Date.now();
    document.getElementById("time").textContent = fmt(left);
  }

  update();
  setInterval(update,200);

});

</script>

</body>
</html>
